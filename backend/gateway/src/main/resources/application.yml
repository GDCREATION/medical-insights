server:
  port: 8080

agent:
  url: ${AGENT_URL:http://localhost:8000}

spring:
  application:
    name: gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:9999/realms/demo}

management:
  endpoints:
    web:
      exposure:
        include: health,info


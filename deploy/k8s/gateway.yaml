apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: medinsights
data:
  AGENT_URL: "http://agent.medinsights.svc.cluster.local:8000"
  OIDC_ISSUER: "http://oidc.medinsights.svc.cluster.local:9999/default"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: medinsights
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: gateway-config
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: medinsights
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080


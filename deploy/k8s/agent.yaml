apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
  namespace: medinsights
data:
  RULE_ENGINE_URL: "http://rule-engine.medinsights.svc.cluster.local:8001"
  AUDIT_URL: "http://audit.medinsights.svc.cluster.local:8002"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: medinsights
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
    spec:
      containers:
        - name: agent
          image: agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: agent-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: medinsights
spec:
  selector:
    app: agent
  ports:
    - name: http
      port: 8000
      targetPort: 8000


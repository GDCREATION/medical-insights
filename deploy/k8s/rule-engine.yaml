apiVersion: apps/v1
kind: Deployment
metadata:
  name: rule-engine
  namespace: medinsights
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rule-engine
  template:
    metadata:
      labels:
        app: rule-engine
    spec:
      containers:
        - name: rule-engine
          image: rule-engine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rule-engine
  namespace: medinsights
spec:
  selector:
    app: rule-engine
  ports:
    - name: http
      port: 8001
      targetPort: 8001


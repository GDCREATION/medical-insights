apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit
  namespace: medinsights
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit
  template:
    metadata:
      labels:
        app: audit
    spec:
      containers:
        - name: audit
          image: audit:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: audit
  namespace: medinsights
spec:
  selector:
    app: audit
  ports:
    - name: http
      port: 8002
      targetPort: 8002

